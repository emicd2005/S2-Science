<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive revision for Cambridge IGCSE Co-ordinated Sciences (0654), S2 units 6-10.">
<meta name="color-scheme" content="light dark">
<style>
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; padding:0; }
  img{ max-width:100%; }
  [hidden]{ display:none !important; }
</style>
<title>S2 Science Units 6-10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky unit nav + one scrolling column of rounded cards; one accent hue per subtopic. */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#edf1f8; --surface3:#e3e9f3;
  --ink:#101a2b; --ink2:#3f4e66; --muted:#6a7a93; --line:#d8e0ec;
  --ok:#15803d; --okbg:#e7f6ec; --bad:#b4252a; --badbg:#fdecec; --warn:#9a5b00;
  --ac-raw:#2563eb; --ac:var(--ac-raw);
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-math:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --r:16px; --r-s:11px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1422; --surface:#151e2e; --surface2:#1c2738; --surface3:#243044;
  --ink:#e9eef7; --ink2:#b9c5d8; --muted:#8d9cb3; --line:#2c3a52;
  --ok:#5fd68a; --okbg:#143021; --bad:#ff9ea1; --badbg:#3a1a1c; --warn:#f0b957;
  --ac:color-mix(in srgb,var(--ac-raw) 62%,#ffffff); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1422; --surface:#151e2e; --surface2:#1c2738; --surface3:#243044;
  --ink:#e9eef7; --ink2:#b9c5d8; --muted:#8d9cb3; --line:#2c3a52;
  --ok:#5fd68a; --okbg:#143021; --bad:#ff9ea1; --badbg:#3a1a1c; --warn:#f0b957;
  --ac:color-mix(in srgb,var(--ac-raw) 62%,#ffffff); color-scheme:dark;
}
/* accent must be re-derived wherever --ac-raw is set, or every section would inherit the root accent */
.view,.unitcard,.subbtn,.chip,.rc{--ac:var(--ac-raw)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .view,
 :root:not([data-theme="light"]) .unitcard,:root:not([data-theme="light"]) .subbtn,
 :root:not([data-theme="light"]) .chip,:root:not([data-theme="light"]) .rc{--ac:color-mix(in srgb,var(--ac-raw) 62%,#ffffff)}}
:root[data-theme="dark"] .view,:root[data-theme="dark"] .unitcard,:root[data-theme="dark"] .subbtn,
:root[data-theme="dark"] .chip,:root[data-theme="dark"] .rc{--ac:color-mix(in srgb,var(--ac-raw) 62%,#ffffff)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:17.5px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- header ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:12;background:var(--surface)}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar .wrap{padding-block:9px}
.brandrow{display:flex;align-items:center;gap:10px;min-height:34px}
.brand{font-size:15.5px;font-weight:700;letter-spacing:.2px}
.brand span{color:var(--muted);font-weight:600}
.homebtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:thin;padding:8px 0 2px;margin:0 -2px;scroll-padding-inline:8px}
.chips::-webkit-scrollbar{height:5px}
.chips::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface2);color:var(--ink2);border-radius:999px;padding:9px 13px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:40px}
.chip b{font-weight:800;color:var(--ink)}
.chip[aria-current="true"]{background:var(--ac-raw);border-color:var(--ac-raw);color:#fff}
.chip[aria-current="true"] b{color:#fff}
.unitsep{flex:0 0 auto;align-self:center;font-size:12.5px;font-weight:800;letter-spacing:.08em;color:var(--muted);padding:0 2px}

/* ---------- views ---------- */
main{padding-block:18px 56px}
.view{display:flex;flex-direction:column;gap:16px}
.subhead{display:flex;flex-direction:column;gap:7px}
.tagrow{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.tag{display:inline-block;background:var(--ac-raw);color:#fff;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:800;letter-spacing:.04em}
.tag.sci{background:var(--surface3);color:var(--ink2)}
.ext{display:inline-block;background:var(--surface3);color:var(--ink);border:1px dashed var(--ac);border-radius:7px;padding:1px 7px;font-size:12.5px;font-weight:800;letter-spacing:.03em;white-space:nowrap}
h2.title{font-size:25px;line-height:1.18;font-weight:800;letter-spacing:-.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.lbl{font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);margin-bottom:8px}
.lbl.n{color:var(--muted)}
.bigidea{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;border-top:3px solid var(--ac-raw)}
.bigidea .t{font-size:19.5px;font-weight:700;line-height:1.35}
.sec{display:flex;flex-direction:column;gap:12px}

/* ---------- figures ---------- */
.fig{margin:0}
.fig .box{overflow-x:auto;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-s);padding:12px}
.fig svg{display:block;width:100%;height:auto;min-width:290px;max-width:100%}
figcaption{font-size:14.5px;color:var(--muted);margin-top:7px}
svg text{font-family:var(--f-ui)}
.sv-lbl{fill:var(--ink);font-size:14px;font-weight:600}
.sv-sm{fill:var(--ink2);font-size:12.5px;font-weight:600}
.sv-mut{fill:var(--muted);font-size:12px;font-weight:600}
.sv-acl{fill:var(--ac);font-size:13px;font-weight:800}
.sv-ln{fill:none;stroke:var(--line);stroke-width:1.6}
.sv-ax{fill:none;stroke:var(--ink2);stroke-width:2}
.sv-gr{fill:none;stroke:var(--line);stroke-width:1}
.sv-ac{fill:none;stroke:var(--ac);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.sv-acd{fill:none;stroke:var(--ac);stroke-width:2;stroke-dasharray:5 4}
.sv-fill{fill:var(--ac);opacity:.16;stroke:none}
.sv-box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.sv-box2{fill:var(--surface3);stroke:var(--line);stroke-width:1.5}
.sv-dot{fill:var(--ink);stroke:none}
.sv-pos{fill:#e4572e;stroke:none}
.sv-neg{fill:#2f6fd0;stroke:none}
.sv-wt{fill:#fff;font-size:14px;font-weight:800}
.sv-arr{fill:var(--ink2);stroke:none}
.sv-arrac{fill:var(--ac);stroke:none}

/* ---------- tables ---------- */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface2);font-size:14.5px;font-weight:800;color:var(--ink)}
tr:last-child td{border-bottom:0}
td.num,th.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.rowlab{font-weight:800;color:var(--ac)}

/* ---------- flip cards ---------- */
.flips{display:grid;grid-template-columns:1fr;gap:11px}
@media(min-width:620px){.flips{grid-template-columns:1fr 1fr}}
.flip{position:relative;perspective:900px;min-height:116px}
.flip>button{position:absolute;inset:0;width:100%;height:100%;background:none;border:0;padding:0;cursor:pointer;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.8,.3,1);font:inherit;color:inherit;text-align:left;border-radius:var(--r-s)}
.flip.on>button{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-s);border:1px solid var(--line);padding:13px 14px;display:flex;flex-direction:column;gap:5px;justify-content:center}
.face.f{background:var(--surface2)}
.face.b{background:var(--surface);transform:rotateY(180deg);border-color:var(--ac)}
.face .term{font-size:17.5px;font-weight:800;line-height:1.25}
.face .def{font-size:16px;color:var(--ink2);line-height:1.4}
.face .hint{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
@media(prefers-reduced-motion:reduce){.flip>button{transition:none}}
.flip.meas{min-height:0}
.flip.meas>button{position:static;height:auto;transform:none;transition:none}
.flip.meas .face{position:static;transform:none}

/* ---------- formulas ---------- */
.fbox{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ac-raw);border-radius:var(--r-s);padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.fname{font-size:14.5px;font-weight:800;color:var(--ink2)}
.eq{font-family:var(--f-math);font-size:25px;line-height:1.5;color:var(--ink);display:block}
.eq sub,.eq sup{font-size:.62em}
.eq.sm{font-size:21px}
.v{font-family:var(--f-math);font-style:italic;font-weight:600}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 .1em}
.frac>span{padding:0 .3em;display:block;text-align:center}
.frac>.n{border-bottom:1.6px solid currentColor;padding-bottom:1px}
.frac>.d{padding-top:1px}
.syms{display:flex;flex-direction:column;gap:4px;font-size:15.5px;color:var(--ink2)}
.syms div{display:flex;gap:8px;align-items:baseline}
.syms .s{flex:0 0 auto;min-width:2.1em;font-family:var(--f-math);font-style:italic;font-weight:700;color:var(--ink)}
.note{font-size:14.5px;color:var(--muted)}
.unitnote{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;font-size:15.5px;color:var(--ink2)}

/* ---------- worked example ---------- */
.work{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.stem{font-size:17.5px;font-weight:600;line-height:1.45}
.steps{display:flex;flex-direction:column;gap:9px}
.step{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 13px;display:flex;gap:10px}
.step .k{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--ac-raw);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center}
.step .bd{display:flex;flex-direction:column;gap:5px}
.step .h{font-weight:800;font-size:16.5px}
.step .t{font-size:16.5px;color:var(--ink2)}
.step.fin{background:var(--okbg);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.step.fin .k{background:var(--ok)}
.btnrow{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.btn{font:inherit;font-size:16px;font-weight:700;border-radius:999px;padding:11px 18px;min-height:46px;cursor:pointer;border:1px solid var(--ac-raw);background:var(--ac-raw);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.flip>button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.prog{font-size:14.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- watch out ---------- */
.watch{display:flex;flex-direction:column;gap:10px}
.wrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:12px 13px;display:flex;flex-direction:column;gap:6px}
.wrow .x,.wrow .y{display:flex;gap:9px;font-size:16.5px;line-height:1.4}
.wrow .x{color:var(--bad);font-weight:600}
.wrow .y{color:var(--ok);font-weight:700}
.wrow .ic{flex:0 0 auto;font-size:15px}

/* ---------- questions ---------- */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.qtop{display:flex;gap:9px;align-items:baseline}
.qn{flex:0 0 auto;font-size:14px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.qt{font-size:17.5px;font-weight:600;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;font:inherit;font-size:17px;background:var(--surface2);border:1.5px solid var(--line);color:var(--ink);border-radius:var(--r-s);padding:12px 13px;cursor:pointer;min-height:48px;width:100%}
.opt .k{flex:0 0 auto;width:27px;height:27px;border-radius:8px;background:var(--surface3);color:var(--ink2);font-size:14.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.good .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{border-radius:var(--r-s);padding:11px 13px;font-size:16.5px;line-height:1.45;border:1px solid var(--line);background:var(--surface2)}
.fb.good{background:var(--okbg);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.fb.bad{background:var(--badbg);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.fb b{font-weight:800}
.numrow{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
input[type=text]{font:inherit;font-size:17px;padding:11px 13px;border-radius:var(--r-s);border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);width:150px;font-variant-numeric:tabular-nums}
.uni{font-size:16.5px;font-weight:700;color:var(--ink2)}
.sol{display:flex;flex-direction:column;gap:7px}
.sol li{font-size:16.5px;color:var(--ink2);line-height:1.45}
ul,ol{margin:0;padding-left:1.25em}
li{margin:3px 0}

/* ---------- home ---------- */
.homehero{display:flex;flex-direction:column;gap:9px}
.homehero h1{font-size:27px;font-weight:800;letter-spacing:-.015em;line-height:1.15}
.homehero .sub{font-size:16.5px;color:var(--muted)}
.unitcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;display:flex;flex-direction:column;gap:11px}
.unitcard .uh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.unitcard .uc{font-size:13px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--ac-raw);border-radius:999px;padding:3px 10px}
.unitcard .un{font-size:19px;font-weight:800}
.sublist{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:620px){.sublist{grid-template-columns:1fr 1fr}}
.subbtn{display:flex;gap:10px;align-items:center;text-align:left;font:inherit;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-s);padding:12px 13px;cursor:pointer;color:var(--ink);min-height:50px}
.subbtn .c{flex:0 0 auto;font-size:13px;font-weight:800;color:#fff;background:var(--ac-raw);border-radius:7px;padding:3px 7px;font-variant-numeric:tabular-nums}
.subbtn .t{font-size:16.5px;font-weight:700;line-height:1.25}
.twocol{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:620px){.twocol{grid-template-columns:1fr 1fr}}

/* ---------- checklist ---------- */
details.must{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 14px}
details.must>summary{cursor:pointer;padding:14px 0;font-size:16px;font-weight:800;color:var(--ink2);list-style:none;display:flex;align-items:center;gap:8px}
details.must>summary::-webkit-details-marker{display:none}
details.must>summary::before{content:"+";font-size:19px;font-weight:800;color:var(--ac);width:1em;text-align:center}
details.must[open]>summary::before{content:"\2212"}
details.must ul{padding:0 0 14px 1.1em}
details.must li{font-size:15.5px;color:var(--ink2)}
details.must li .ext{font-size:11.5px;padding:0 5px;margin-right:5px}

/* ---------- quiz / recap ---------- */
.scorebox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.scorebig{font-size:40px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bar{height:11px;border-radius:999px;background:var(--surface3);overflow:hidden;width:100%}
.bar>i{display:block;height:100%;background:var(--ac-raw);border-radius:999px}
.rev{display:flex;flex-direction:column;gap:7px;width:100%}
.rev div{font-size:15.5px;display:flex;gap:9px;align-items:baseline;color:var(--ink2)}
.recapgrid{display:grid;grid-template-columns:1fr;gap:11px}
@media(min-width:720px){.recapgrid{grid-template-columns:1fr 1fr}}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:13px;display:flex;flex-direction:column;gap:7px;break-inside:avoid}
.rc .rh{display:flex;gap:8px;align-items:baseline}
.rc .rh .c{font-size:12.5px;font-weight:800;color:#fff;background:var(--ac-raw);border-radius:6px;padding:2px 6px}
.rc .rh .t{font-size:16.5px;font-weight:800;line-height:1.2}
.rc ul{padding-left:1.05em}
.rc li{font-size:15px;color:var(--ink2);line-height:1.4}
.rc li b{color:var(--ink)}

/* ---------- print ---------- */
@media print{
  :root{--bg:#fff;--surface:#fff;--surface2:#fff;--surface3:#f0f0f0;--ink:#000;--ink2:#1a1a1a;--muted:#444;--line:#999}
  body{font-size:11pt}
  .appbar,.chips,.homebtn,.no-print{display:none!important}
  main{padding-block:0}
  .view[hidden]{display:flex!important}
  .step[hidden],.q[hidden]{display:flex!important}
  .sol[hidden]{display:block!important}
  .fb{display:none!important}
  .card,.work,.q,.unitcard,.rc,.scorebox,.fbox{break-inside:avoid;page-break-inside:avoid}
  .view{break-before:page;page-break-before:always}
  #v-c24{break-before:auto;page-break-before:auto}
  #v-home,#qdone,.bar,.prog{display:none!important}
  details.must{display:none}
  .flip{min-height:0!important;perspective:none}
  .flip>button{position:static;transform:none!important;display:block;height:auto}
  .face{position:static;transform:none!important;border-radius:var(--r-s)}
  .face.f{border-bottom:0;border-radius:var(--r-s) var(--r-s) 0 0}
  .face.b{border-radius:0 0 var(--r-s) var(--r-s)}
  .opt{min-height:0;padding:6px 8px}
  .opt[data-correct="1"] .k{background:#000;color:#fff}
  .opt[data-correct="1"]::after{content:"\2190 correct";font-weight:800;margin-left:auto;font-size:10pt}
  .btn{display:none!important}
}
</style>
</head>
<body>
<header class="appbar">
  <div class="wrap">
    <div class="brandrow">
      <div class="brand">IGCSE Co-ordinated Sciences <span>0654</span></div>
      <button class="homebtn" id="btn-home" type="button">All units</button>
    </div>
    <nav class="chips" id="chips" aria-label="Subtopics"></nav>
  </div>
</header>
<main class="wrap"><div id="views"></div></main>
<script>
/* ================= SVG helpers ================= */
var P={L:44,R:316,T:18,B:176,W:330,H:212};
function r2(n){return Math.round(n*10)/10}
function gx(v,m){return r2(P.L+(v/m)*(P.R-P.L))}
function gy(v,m){return r2(P.B-(v/m)*(P.B-P.T))}
function sv(w,h,b){return '<svg viewBox="0 0 '+w+' '+h+'" aria-hidden="true" focusable="false">'+b+'</svg>'}
function arrow(x1,y1,x2,y2,cls,fcls){
  var a=Math.atan2(y2-y1,x2-x1),h=9,w=4.8;
  var bx=x2-h*Math.cos(a),by=y2-h*Math.sin(a);
  var sx=-Math.sin(a)*w,sy=Math.cos(a)*w;
  return '<line class="'+(cls||'sv-ax')+'" x1="'+r2(x1)+'" y1="'+r2(y1)+'" x2="'+r2(bx)+'" y2="'+r2(by)+'"/>'+
    '<polygon class="'+(fcls||'sv-arr')+'" points="'+r2(x2)+','+r2(y2)+' '+r2(bx+sx)+','+r2(by+sy)+' '+r2(bx-sx)+','+r2(by-sy)+'"/>';
}
function frame(o){
  var s='',i;

function ion(cx,cy,r,label,marks,charge){
  var s='<circle class="sv-ln" cx="'+cx+'" cy="'+cy+'" r="'+r+'"/>';
  s+='<text class="sv-lbl" x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle">'+label+'</text>';
  (marks||[]).forEach(function(m){
    var a=m.a*Math.PI/180,x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);
    if(m.t==='d'){s+='<circle class="sv-dot" cx="'+r2(x)+'" cy="'+r2(y)+'" r="3.7"/>';}
    else{s+='<path d="M'+r2(x-3.8)+' '+r2(y-3.8)+'l7.6 7.6M'+r2(x+3.8)+' '+r2(y-3.8)+'l-7.6 7.6" style="stroke:var(--ink);stroke-width:2.2;fill:none"/>';}
  });
  if(charge){s+='<text class="sv-acl" x="'+(cx+r+5)+'" y="'+(cy-r+6)+'">'+charge+'</text>';}
  return s;
}
function pathway(o){

  s+='<text class="sv-sm" x="48" y="'+(yR-9)+'">Reactants</text>';
  s+='<text class="sv-sm" x="304" y="'+(yP+(o.exo?20:-9))+'" text-anchor="end">Products</text>';
  s+=arrow(166,yR,166,yK+2,'sv-acd','sv-arrac')+arrow(166,yK,166,yR-2,'sv-acd','sv-arrac');
  s+='<text class="sv-acl" x="166" y="'+r2(yK-13)+'" text-anchor="middle">E<tspan baseline-shift="sub" font-size="10">a</tspan></text>';
  s+=arrow(266,yR,266,yP+(o.exo?-2:2),'sv-acd','sv-arrac');
  s+='<text class="sv-acl" x="274" y="'+r2((yR+yP)/2)+'">ΔH '+(o.exo?'−':'+')+'</text>';
  s+='<line class="sv-gr" x1="48" y1="'+yR+'" x2="300" y2="'+yR+'"/>';
  s+='<line class="sv-gr" x1="48" y1="'+yP+'" x2="300" y2="'+yP+'"/>';

}

 visuals:[
  {cap:'Distance–time graph: <b>gradient = speed</b>. Flat means stopped, steeper means faster, a curve means changing speed.',
   svg:sv(330,212,frame({xmax:10,ymax:50,xticks:[2,4,6,8,10],yticks:[10,20,30,40,50],xl:'time / s',yl:'distance / m'})+
    '<polyline class="sv-ac" points="'+gx(0,10)+','+gy(0,50)+' '+gx(3,10)+','+gy(15,50)+' '+gx(5,10)+','+gy(15,50)+'"/>'+
    '<path class="sv-ac" d="M'+gx(5,10)+' '+gy(15,50)+' Q'+gx(8,10)+' '+gy(20,50)+' '+gx(9,10)+' '+gy(45,50)+'"/>'+
    '<text class="sv-sm" x="'+gx(1.3,10)+'" y="'+(gy(9,50)+2)+'">constant speed</text>'+
    '<text class="sv-sm" x="'+gx(3.3,10)+'" y="'+(gy(17,50)-4)+'">at rest</text>'+
    '<text class="sv-sm" x="'+gx(9,10)+'" y="'+(gy(45,50)-8)+'" text-anchor="end">accelerating</text>')},
  {cap:'Speed–time graph: <b>gradient = acceleration</b>, <b>area under the line = distance</b>.',
   svg:sv(330,212,frame({xmax:10,ymax:10,xticks:[2,4,6,8,10],yticks:[2,4,6,8,10],xl:'time / s',yl:'speed / (m/s)'})+
    '<polygon class="sv-fill" points="'+gx(0,10)+','+gy(0,10)+' '+gx(4,10)+','+gy(6,10)+' '+gx(7,10)+','+gy(6,10)+' '+gx(10,10)+','+gy(0,10)+'"/>'+
    '<polyline class="sv-ac" points="'+gx(0,10)+','+gy(0,10)+' '+gx(4,10)+','+gy(6,10)+' '+gx(7,10)+','+gy(6,10)+' '+gx(10,10)+','+gy(0,10)+'"/>'+
    '<text class="sv-sm" x="'+gx(0.6,10)+'" y="'+gy(4.2,10)+'">accelerating</text>'+
    '<text class="sv-sm" x="'+gx(5.5,10)+'" y="'+(gy(6,10)-8)+'" text-anchor="middle">constant speed</text>'+
    '<text class="sv-sm" x="'+gx(9.6,10)+'" y="'+gy(4.2,10)+'" text-anchor="end">decelerating</text>'+
    '<text class="sv-acl" x="'+gx(5,10)+'" y="'+gy(2.4,10)+'" text-anchor="middle">area = distance</text>')}
 ],
 fbox:[
  {name:'Speed',eq:'<i class="v">S</i> = <span class="frac"><span class="n"><i class="v">D</i></span><span class="d"><i class="v">T</i></span></span>',
   syms:[['S','speed, m/s (or km/h)'],['D','distance travelled, m'],['T','time taken, s']],
   note:'Your exam paper writes this as <i class="v">v</i> = <i class="v">s</i>/<i class="v">t</i>. Same equation, different letters.'},
  {name:'Acceleration',eq:'<i class="v">A</i> = <span class="frac"><span class="n">Δ<i class="v">S</i></span><span class="d">Δ<i class="v">T</i></span></span>',
   syms:[['A','acceleration, m/s<sup>2</sup>'],['ΔS','change in speed, m/s'],['ΔT','time for that change, s']],
   note:'Exam paper: <i class="v">a</i> = Δ<i class="v">v</i>/Δ<i class="v">t</i>. Deceleration is a <b>negative</b> acceleration.',ext:true},
  {name:'Free fall',eq:'<i class="v">g</i> ≈ 9.8 m/s<sup>2</sup>',
   syms:[['g','acceleration of free fall near the Earth’s surface']],
   note:'Treated as constant close to the ground.',ext:true}
 ],
 terms:[
  {t:'Speed',d:'Distance travelled <b>per unit time</b>.'},
  {t:'Velocity',d:'Speed in a <b>given direction</b>.',ext:true},
  {t:'Acceleration',d:'Change in velocity per unit time.',ext:true},
  {t:'Accelerating',d:'Speed is <b>increasing</b>. Decelerating = speed decreasing.'},
  {t:'Constant acceleration',d:'Speed–time graph is a <b>straight sloping line</b>.',ext:true},
  {t:'Changing acceleration',d:'Speed–time graph is <b>curved</b>.',ext:true},
  {t:'Gradient on a distance–time graph',d:'Equals the <b>speed</b>: rise ÷ run.'},
  {t:'Area under a speed–time graph',d:'Equals the <b>distance travelled</b>.'}
 ],
 work:{stem:'A trolley speeds up steadily from 0 to 6.0 m/s in 4.0 s. Find the acceleration and the distance travelled, then describe its distance–time graph.',
  svg:sv(330,212,frame({xmax:5,ymax:8,xticks:[1,2,3,4,5],yticks:[2,4,6,8],xl:'time / s',yl:'speed / (m/s)'})+
   '<polygon class="sv-fill" points="'+gx(0,5)+','+gy(0,8)+' '+gx(4,5)+','+gy(6,8)+' '+gx(4,5)+','+gy(0,8)+'"/>'+
   '<polyline class="sv-ac" points="'+gx(0,5)+','+gy(0,8)+' '+gx(4,5)+','+gy(6,8)+'"/>'+
   '<text class="sv-acl" x="'+gx(2.4,5)+'" y="'+gy(1.6,8)+'" text-anchor="middle">area</text>'),
  steps:[
   {h:'Read the graph',t:'Straight sloping line: the speed rises steadily, so the acceleration is <b>constant</b>.'},
   {h:'Acceleration = gradient',t:'<i class="v">A</i> = Δ<i class="v">S</i> ÷ Δ<i class="v">T</i> = 6.0 ÷ 4.0 = <b>1.5 m/s<sup>2</sup></b>.'},
   {h:'Distance = area under the line',t:'The area is a triangle: ½ × base × height = ½ × 4.0 × 6.0.'},
   {h:'Distance',t:'= <b>12 m</b> travelled in the 4.0 s.',fin:true},
   {h:'Shape of the distance–time graph',t:'It <b>curves upwards</b> (getting steeper) and reaches 12 m at 4.0 s.',fin:true}
  ]},
 watch:[
  {x:'A flat line on a distance–time graph means constant speed.',v:'Flat on distance–time means <b>at rest</b>.'},
  {x:'Using the gradient of a speed–time graph to find distance.',v:'Gradient = acceleration; <b>area</b> = distance.'},
  {x:'Mixing km/h with m/s in one calculation.',v:'Convert first, then substitute into <i class="v">S</i> = <i class="v">D</i>/<i class="v">T</i>.'}
 ],
 qc:[
  {q:'Which part of this distance–time graph shows the object at rest?',
   svg:sv(330,212,frame({xmax:8,ymax:40,xticks:[2,4,6,8],yticks:[10,20,30,40],xl:'time / s',yl:'distance / m'})+
    '<polyline class="sv-ac" points="'+gx(0,8)+','+gy(0,40)+' '+gx(2,8)+','+gy(20,40)+' '+gx(5,8)+','+gy(20,40)+' '+gx(8,8)+','+gy(35,40)+'"/>'+
    '<text class="sv-acl" x="'+gx(1,8)+'" y="'+gy(13,40)+'" text-anchor="middle">P</text>'+
    '<text class="sv-acl" x="'+gx(3.5,8)+'" y="'+(gy(20,40)-7)+'" text-anchor="middle">Q</text>'+
    '<text class="sv-acl" x="'+gx(7,8)+'" y="'+gy(24,40)+'" text-anchor="middle">R</text>'),
   opts:['P only','Q only','R only','P and R'],correct:1,
   why:['P is a sloping line, so the distance keeps increasing — it is moving.',
    'Correct: on Q the distance does not change, so the object is not moving.',
    'R slopes upwards, so the object is moving again.',
    'Both P and R slope, so both show movement.']},
  {q:'A car speeds up from 0 to 6.0 m/s in 4.0 s. What is its acceleration?',
   opts:['1.5 m/s<sup>2</sup>','24 m/s<sup>2</sup>','0.67 m/s<sup>2</sup>','12 m/s<sup>2</sup>'],correct:0,
   why:['Correct: <i class="v">A</i> = 6.0 ÷ 4.0 = 1.5 m/s<sup>2</sup>.',
    '24 is 6.0 × 4.0 — you must <b>divide</b> the change in speed by the time.',
    '0.67 is 4.0 ÷ 6.0, the fraction upside down.',
    '12 m is the <b>distance</b> (the area under the line), not the acceleration.']},
  {type:'num',q:'A runner covers 150 m in 12 s. Calculate the average speed.',ans:12.5,tol:0.05,unit:'m/s',
   sol:['<i class="v">S</i> = <i class="v">D</i> ÷ <i class="v">T</i>','= 150 ÷ 12','= <b>12.5 m/s</b>']}
 ],
 must:[{t:'Define speed as distance travelled per unit time'},{t:'Use <i class="v">S</i> = <i class="v">D</i>/<i class="v">T</i>'},
  {t:'Use the rearranged forms to find distance or time'},{t:'Define velocity as speed in a given direction',ext:true},
  {t:'Define acceleration and use <i class="v">A</i> = Δ<i class="v">S</i>/Δ<i class="v">T</i>',ext:true},
  {t:'Sketch, plot and interpret distance–time and speed–time graphs'},
  {t:'Increasing speed = accelerating; decreasing = decelerating'},
  {t:'From a graph shape: at rest'},{t:'From a graph shape: constant speed'},{t:'From a graph shape: accelerating'},{t:'From a graph shape: decelerating'},
  {t:'Constant acceleration = straight sloping speed–time line',ext:true},{t:'Changing acceleration = curved speed–time line',ext:true},
  {t:'Speed from the gradient of a distance–time graph'},{t:'Acceleration from the gradient of a speed–time graph',ext:true},
  {t:'Area under a speed–time graph: constant speed'},{t:'Area under a speed–time graph: constant acceleration'},
  {t:'Deceleration is negative acceleration; use it in calculations',ext:true},{t:'<i class="v">g</i> ≈ 9.8 m/s<sup>2</sup> near the Earth',ext:true}]
};

SUBS.p151={code:'P1.5.1',title:'Effects of forces',unit:'S2.7',sci:'Physics',ac:'#4f46e5',
 big:'A resultant force changes an object’s speed, direction or shape; balanced forces change nothing.',
 visuals:[
  {cap:'Forces on one straight line: add those pointing the same way, subtract those pointing back.',
   svg:sv(330,170,
    '<rect class="sv-box2" x="118" y="52" width="94" height="52" rx="7"/>'+
    '<text class="sv-lbl" x="165" y="84" text-anchor="middle">60 kg</text>'+
    arrow(212,78,308,78,'sv-ac','sv-arrac')+
    '<text class="sv-acl" x="260" y="68" text-anchor="middle">250 N push</text>'+
    arrow(118,78,42,78,'sv-ax','sv-arr')+
    '<text class="sv-sm" x="80" y="68" text-anchor="middle">100 N friction</text>'+
    '<line class="sv-gr" x1="20" y1="112" x2="310" y2="112"/>'+
    arrow(140,136,230,136,'sv-ac','sv-arrac')+
    '<text class="sv-acl" x="185" y="158" text-anchor="middle">resultant = 250 − 100 = 150 N</text>')},
  {cap:'Load–extension graph for a spring: straight while the extension is proportional to the load.',
   svg:sv(330,212,frame({xmax:5,ymax:10,xticks:[1,2,3,4,5],yticks:[2,4,6,8,10],xl:'extension / cm',yl:'load / N'})+
    '<polyline class="sv-ac" points="'+gx(0,5)+','+gy(0,10)+' '+gx(3,5)+','+gy(6,10)+'"/>'+
    '<path class="sv-ac" d="M'+gx(3,5)+' '+gy(6,10)+' Q'+gx(4.2,5)+' '+gy(7.2,10)+' '+gx(4.8,5)+' '+gy(7.6,10)+'"/>'+
    '<circle class="sv-dot" cx="'+gx(3,5)+'" cy="'+gy(6,10)+'" r="4.5"/>'+
    '<text class="sv-acl" x="'+gx(2.92,5)+'" y="'+(gy(6,10)-13)+'" text-anchor="end">limit of proportionality</text>'+
    '<text class="sv-sm" x="'+gx(0.7,5)+'" y="'+gy(3.6,10)+'">straight line</text>')}
 ],
 fbox:[
  {name:'Newton’s second law',eq:'<i class="v">F</i> = <i class="v">m</i> × <i class="v">A</i>',
   syms:[['F','resultant force, N'],['m','mass, kg'],['A','acceleration, m/s<sup>2</sup>']],
   note:'<b>Resultant</b> force, and the acceleration is in the <b>same direction</b> as it. Exam paper: <i class="v">F</i> = <i class="v">ma</i>.',ext:true},
  {name:'Spring constant',eq:'<i class="v">k</i> = <span class="frac"><span class="n"><i class="v">F</i></span><span class="d"><i class="v">x</i></span></span>',
   syms:[['k','spring constant, N/m'],['F','force (load), N'],['x','extension, m']],
   note:'Extension = stretched length − original length. Change cm to m first.',ext:true}
 ],
 terms:[
  {t:'Force can change…',d:'The <b>size</b>, <b>shape</b> and <b>motion</b> of an object.'},
  {t:'Resultant force',d:'The single force that has the same effect as all the forces together.'},
  {t:'Friction',d:'Force between two surfaces that may <b>impede motion</b> and produce <b>heating</b>.'},
  {t:'Drag',d:'Friction on an object moving through a <b>liquid</b> or a <b>gas</b> (air resistance).'},
  {t:'Newton’s first law',d:'No resultant force → stays at rest, or keeps a <b>constant speed in a straight line</b>.'},
  {t:'Limit of proportionality',d:'Point where the load–extension graph <b>stops being a straight line</b>.',ext:true}
 ],
 work:{stem:'A 60 kg sledge is pushed with a force of 250 N. Friction on the sledge is 100 N. Calculate its acceleration.',
  steps:[
   {h:'Find the resultant force',t:'The forces are on the same line and point opposite ways: 250 − 100 = <b>150 N</b> forwards.'},
   {h:'Choose the equation',t:'<i class="v">F</i> = <i class="v">m</i> × <i class="v">A</i>, so <i class="v">A</i> = <i class="v">F</i> ÷ <i class="v">m</i>.'},
   {h:'Substitute',t:'<i class="v">A</i> = 150 ÷ 60.'},
   {h:'Answer',t:'<b>2.5 m/s<sup>2</sup></b>, forwards — the same direction as the resultant force.',fin:true}
  ]},
 work2:{stem:'A load of 2.0 N stretches a spring by 4.0 cm, inside the straight part of the graph. Find the spring constant.',ext:true,
  steps:[
   {h:'Convert the extension',t:'4.0 cm = 4.0 ÷ 100 = <b>0.040 m</b>.'},
   {h:'Use the definition',t:'<i class="v">k</i> = force per unit extension = <i class="v">F</i> ÷ <i class="v">x</i> = 2.0 ÷ 0.040.'},
   {h:'Answer',t:'<b><i class="v">k</i> = 50 N/m</b>.',fin:true}
  ]},
 watch:[
  {x:'Giving a weight in kilograms.',v:'Weight is a force, so it is measured in <b>newtons</b>.'},
  {x:'Putting the total push into <i class="v">F</i> = <i class="v">m</i><i class="v">A</i>.',v:'Use the <b>resultant</b> force (push − friction).'},
  {x:'A force is needed to keep moving at constant speed.',v:'Constant speed means the forces are <b>balanced</b>.'}
 ],
 qc:[
  {q:'Which row is correctly recorded? (<i class="v">g</i> = 9.8 N/kg)',
   tbl:{head:['','Mass','Weight'],rows:[['A','5 g','49 N'],['B','1 kg','9.8 N'],['C','10 kg','10 N'],['D','2 kg','2 kg']]},
   opts:['A','B','C','D'],correct:1,
   why:['5 g is 0.005 kg, so the weight is 0.005 × 9.8 = 0.049 N, not 49 N.',
    'Correct: 1 × 9.8 = 9.8 N.',
    '10 kg weighs 10 × 9.8 = 98 N.',
    'Weight must be in <b>newtons</b>, never kilograms.']},
  {q:'A box is pulled right with 300 N while friction pushes left with 120 N. What is the resultant force?',
   opts:['420 N to the right','180 N to the right','180 N to the left','0 N'],correct:1,
   why:['You only add forces that point the <b>same</b> way; these are opposite.',
    'Correct: 300 − 120 = 180 N, towards the larger force.',
    'The resultant acts towards the <b>larger</b> force, which pulls right.',
    'The forces are not equal, so they do not cancel.']},
  {type:'num',q:'A resultant force of 3000 N acts on a 1200 kg car. Calculate its acceleration.',ans:2.5,tol:0.02,unit:'m/s<sup>2</sup>',ext:true,
   sol:['<i class="v">A</i> = <i class="v">F</i> ÷ <i class="v">m</i>','= 3000 ÷ 1200','= <b>2.5 m/s<sup>2</sup></b>']},
  {q:'On a load–extension graph, what does the limit of proportionality mark?',ext:true,
   opts:['Where the spring snaps','Where the line stops being straight','Where the extension is zero','Where the load is largest'],correct:1,
   why:['Snapping is not what this point means.',
    'Correct: beyond it, extension is no longer proportional to load.',
    'Zero extension is the origin of the graph.',
    'The graph often continues past this point to larger loads.']}
 ],
 must:[{t:'Forces change size, shape and motion'},{t:'Resultant of forces along the same straight line'},
  {t:'Friction impedes motion and produces heating'},{t:'Drag acts in liquids'},{t:'Drag acts in gases (air resistance)'},
  {t:'No resultant force: at rest or constant speed in a straight line'},
  {t:'Use <i class="v">F</i> = <i class="v">m</i><i class="v">A</i>; force and acceleration same direction',ext:true},
  {t:'Sketch, plot and interpret load–extension graphs; describe the experiment',ext:true},
  {t:'Spring constant = force per unit extension; use <i class="v">k</i> = <i class="v">F</i>/<i class="v">x</i>',ext:true},
  {t:'Identify the limit of proportionality on the graph',ext:true}]
};

SUBS.p152={code:'P1.5.2',title:'Turning effect of forces',unit:'S2.7',sci:'Physics',ac:'#0891b2',
 big:'A force turns things more when it acts further from the pivot.',
 visuals:[
  {cap:'Everyday moments: the longer the spanner, the bigger the turning effect for the same force.',
   svg:sv(330,160,
    '<rect class="sv-box" x="58" y="92" width="88" height="16" rx="5"/>'+
    '<circle class="sv-box2" cx="58" cy="100" r="18"/><circle class="sv-dot" cx="58" cy="100" r="4"/>'+
    arrow(146,70,146,30,'sv-ax','sv-arr')+'<text class="sv-sm" x="146" y="22" text-anchor="middle">20 N</text>'+
    '<text class="sv-mut" x="102" y="128" text-anchor="middle">0.10 m</text>'+
    '<text class="sv-sm" x="76" y="146" text-anchor="middle">moment 2.0 N m</text>'+
    '<rect class="sv-box" x="196" y="92" width="112" height="16" rx="5"/>'+
    '<circle class="sv-box2" cx="196" cy="100" r="18"/><circle class="sv-dot" cx="196" cy="100" r="4"/>'+
    arrow(302,70,302,30,'sv-ac','sv-arrac')+'<text class="sv-acl" x="302" y="22" text-anchor="middle">20 N</text>'+
    '<text class="sv-mut" x="252" y="128" text-anchor="middle">0.20 m</text>'+
    '<text class="sv-acl" x="252" y="146" text-anchor="middle">moment 4.0 N m</text>')},
  {cap:'Balanced beam, pivot at 50 cm: 20 N × 30 cm = 600 N cm anticlockwise equals 30 N × 20 cm = 600 N cm clockwise.',
   svg:beam({pivot:50,forces:[{at:20,lab:'20 N'},{at:70,lab:'30 N'}]})}
 ],
 fbox:[
  {name:'Moment of a force',eq:'moment = <i class="v">F</i> × <i class="v">d</i>',
   syms:[['F','force, N'],['d','perpendicular distance from the pivot, m (or cm)'],['moment','N m (or N cm)']],
   note:'<b>Perpendicular</b> distance, measured from the <b>pivot</b>.'},
  {name:'Principle of moments',eq:'sum of anticlockwise moments = sum of clockwise moments',
   syms:[['','true whenever a beam balances']],
   note:'Use it with one force on each side of the pivot.',ext:true}
 ],
 terms:[
  {t:'Moment',d:'Measure of the <b>turning effect</b> of a force about a pivot.'},
  {t:'Pivot',d:'Fixed point the object turns about.'},
  {t:'Equilibrium',d:'No resultant force <b>and</b> no resultant moment.'},
  {t:'Principle of moments',d:'When balanced: anticlockwise moments = clockwise moments.',ext:true},
  {t:'Everyday examples',d:'Spanner, door handle, see-saw, scissors, bicycle brake lever.'}
 ],
 work:{stem:'The beam below is balanced on a pivot at the 50 cm mark. A 4.0 N force acts down at 20 cm and a 6.0 N force acts down at 60 cm. At which mark does the 5.0 N force act?',
  svg:beam({pivot:50,forces:[{at:20,lab:'4.0 N'},{at:60,lab:'6.0 N'},{at:76,lab:'5.0 N',q:true}]}),
  steps:[
   {h:'Distances from the pivot',t:'4.0 N: 50 − 20 = 30 cm (anticlockwise). 6.0 N: 60 − 50 = 10 cm (clockwise).'},
   {h:'Anticlockwise moment',t:'4.0 × 30 = <b>120 N cm</b>.'},
   {h:'Clockwise moment so far',t:'6.0 × 10 = <b>60 N cm</b>.'},
   {h:'What is missing',t:'Balanced, so clockwise must also total 120. The 5.0 N force must give 120 − 60 = <b>60 N cm</b>.'},
   {h:'Find its distance',t:'<i class="v">d</i> = 60 ÷ 5.0 = <b>12 cm</b> from the pivot, on the clockwise side.'},
   {h:'Convert to a mark',t:'50 + 12 = the <b>62 cm</b> mark.',fin:true}
  ]},
 watch:[
  {x:'Using the distance from the end of the beam.',v:'Always measure from the <b>pivot</b>.'},
  {x:'Mixing cm and m in the same balance.',v:'Keep one unit throughout; N cm and N m both work if consistent.'},
  {x:'Equilibrium means only that forces balance.',v:'It needs no resultant force <b>and</b> no resultant moment.'}
 ],
 qc:[
  {q:'A beam has no resultant force and no resultant moment acting on it. Which statement is correct?',
   opts:['It is in equilibrium','It will start to turn clockwise','It must be accelerating','It has no weight'],correct:0,
   why:['Correct: that is exactly the definition of equilibrium.',
    'Turning needs a resultant <b>moment</b>, and there is none.',
    'Accelerating needs a resultant <b>force</b>, and there is none.',
    'It can still have weight; the weight is simply balanced.']},
  {type:'num',q:'A force of 12 N acts 0.25 m from a pivot, at right angles to the spanner. Calculate the moment in N m.',ans:3,tol:0.02,unit:'N m',
   sol:['moment = <i class="v">F</i> × <i class="v">d</i>','= 12 × 0.25','= <b>3.0 N m</b>']},
  {q:'Why is a long spanner easier to use than a short one?',
   opts:['It applies a larger force','The larger distance from the pivot gives a larger moment','It gives a smaller moment, so less effort','It is heavier, so it pushes harder'],correct:1,
   why:['Your hand applies the same force; only the distance changes.',
    'Correct: moment = force × distance, so a longer distance turns the nut more.',
    'A smaller moment would make it <b>harder</b> to turn.',
    'Extra weight is not what loosens the nut.']}
 ],
 must:[{t:'Moment as a measure of turning effect, with everyday examples'},
  {t:'Apply the principle of moments, one force each side of the pivot',ext:true},
  {t:'moment = force × perpendicular distance from the pivot; use it'},
  {t:'No resultant force and no resultant moment = equilibrium'}]
};

SUBS.p153={code:'P1.5.3',title:'Centre of gravity',unit:'S2.7',sci:'Physics',ac:'#52525b',

<script>
function wrapText(t,cx,y,maxw,cls,lh){
  cls=cls||'sv-sm';lh=lh||15;
  var cpl=Math.max(7,Math.floor(maxw/6.4)),words=String(t).split(' '),lines=[],cur='';
  words.forEach(function(w){if((cur+' '+w).trim().length<=cpl){cur=(cur+' '+w).trim();}else{if(cur){lines.push(cur);}cur=w;}});
  if(cur){lines.push(cur);}
  var s='',y0=y-((lines.length-1)*lh)/2;
  lines.forEach(function(l,i){s+='<text class="'+cls+'" x="'+r2(cx)+'" y="'+r2(y0+i*lh)+'" text-anchor="middle">'+l+'</text>';});
  return s;
}
function flow(items,bh){
  bh=bh||58;
  var n=items.length,gap=15,bw=(326-(n-1)*gap)/n,s='';
  items.forEach(function(t,i){
    var x=2+i*(bw+gap);
    s+='<rect class="sv-box" x="'+r2(x)+'" y="12" width="'+r2(bw)+'" height="'+bh+'" rx="9"/>';
    s+=wrapText(t,x+bw/2,12+bh/2,bw-8);
    if(i<n-1){s+=arrow(x+bw+2,12+bh/2,x+bw+gap-2,12+bh/2,'sv-ac','sv-arrac');}
  });
  return sv(330,bh+28,s);
}
function lifts(items){
  var s='',pw=78,gap=6;
  items.forEach(function(it,i){
    var x=i*(pw+gap)+2,base=120,sh=base-it.h*30;
    s+='<rect class="sv-box2" x="'+x+'" y="'+base+'" width="'+pw+'" height="7" rx="2"/>';
    s+='<line x1="'+(x+9)+'" y1="'+sh+'" x2="'+(x+pw-9)+'" y2="'+sh+'" style="stroke:var(--ink2);stroke-width:3.5"/>';
    s+='<circle cx="'+(x+pw/2)+'" cy="'+(sh-10)+'" r="9" style="fill:var(--ac)"/>';
    s+=arrow(x+pw/2,base-3,x+pw/2,sh+5,'sv-acd','sv-arrac');
    s+='<text class="sv-acl" x="'+(x+pw/2)+'" y="'+(base+25)+'" text-anchor="middle">'+it.k+'</text>';
    s+='<text class="sv-sm" x="'+(x+pw/2)+'" y="'+(base+42)+'" text-anchor="middle">'+it.w+'</text>';
    s+='<text class="sv-mut" x="'+(x+pw/2)+'" y="'+(base+57)+'" text-anchor="middle">'+it.hl+'</text>';
  });
  s+='<text class="sv-mut" x="165" y="12" text-anchor="middle">each ball is lifted in the same time</text>';
  return sv(330,188,s);
}

  var s='<div class="flips">';
  terms.forEach(function(t){
    s+='<div class="flip"><button type="button" data-act="flip" aria-label="Show definition of '+t.t.replace(/<[^>]+>/g,'')+'">'+
      '<span class="face f"><span class="term">'+t.t+'</span>'+(t.ext?'<span class="hint"><span class="ext">EXTENDED</span></span>':'')+'<span class="hint">tap to flip</span></span>'+
      '<span class="face b"><span class="def">'+t.d+'</span></span></button></div>';
  });
  return s+'</div>';
}
function workHtml(w,key){
  var s='<div class="work" data-work="'+key+'"><div class="lbl">Worked example '+(w.ext?'<span class="ext">EXTENDED</span>':'')+'</div>'+
    '<div class="stem">'+w.stem+'</div>'+(w.svg?'<figure class="fig"><div class="box">'+w.svg+'</div></figure>':'')+'<div class="steps">';
  w.steps.forEach(function(st,i){
    s+='<div class="step'+(st.fin?' fin':'')+'" hidden><span class="k">'+(i+1)+'</span><span class="bd"><span class="h">'+st.h+'</span><span class="t">'+st.t+'</span></span></div>';
  });
  s+='</div><div class="btnrow no-print"><button class="btn" type="button" data-act="step">Next step</button>'+
    '<button class="btn ghost" type="button" data-act="rework" hidden>Start again</button>'+
    '<span class="prog">0 / '+w.steps.length+'</span></div></div>';
  return s;
}
function watchHtml(w){
  var s='<div class="watch">';
  w.forEach(function(r){s+='<div class="wrow"><span class="x"><span class="ic">❌</span><span>'+r.x+'</span></span><span class="y"><span class="ic">✅</span><span>'+r.v+'</span></span></div>';});
  return s+'</div>';
}
function qHtml(q,i,ns){
  var s='<div class="q" data-q="'+ns+':'+i+'"'+(q.type==='num'?' data-num="'+q.ans+'" data-tol="'+(q.tol||0.01)+'"':'')+'>';
  s+='<div class="qtop"><span class="qn">Q'+(i+1)+'</span><span class="qt">'+q.q+' '+extBadge(q.ext)+(q.sub?' <span class="qn">'+q.sub+'</span>':'')+'</span></div>';
  if(q.svg){s+='<figure class="fig"><div class="box">'+q.svg+'</div></figure>';}
  if(q.tbl){s+=tbl(q.tbl);}
  if(q.type==='num'){
    s+='<div class="numrow"><input type="text" inputmode="decimal" id="in-'+ns+'-'+i+'" aria-label="Your answer" placeholder="answer">'+
      '<span class="uni">'+(q.unit||'')+'</span><button class="btn no-print" type="button" data-act="checknum">Check</button></div>';
    s+='<div class="fb" hidden></div><ol class="sol" hidden>';
    (q.sol||[]).forEach(function(l){s+='<li>'+l+'</li>';});
    s+='</ol>';
  }else{
    s+='<div class="opts">';
    q.opts.forEach(function(o,j){
      var body=(String(o).trim()===LET[j])?'':'<span>'+o+'</span>';
      s+='<button class="opt" type="button" data-act="pick" data-i="'+j+'" data-correct="'+(j===q.correct?1:0)+'" aria-label="Option '+LET[j]+'"><span class="k">'+LET[j]+'</span>'+body+'</button>';
    });
    s+='</div><div class="fb" hidden></div>';
  }
  return s+'</div>';
}
function mustHtml(m){
  var s='<details class="must no-print"><summary>What you must be able to do ('+m.length+')</summary><ul>';
  m.forEach(function(p){s+='<li>'+(p.ext?'<span class="ext">E</span>':'')+p.t+'</li>';});
  return s+'</ul></details>';
}
function subView(id){
  var d=SUBS[id],s='';
  s+='<section class="view" id="v-'+id+'" style="--ac-raw:'+d.ac+'" hidden>';
  s+='<div class="subhead"><div class="tagrow"><span class="tag">'+d.code+'</span><span class="tag sci">'+d.unit+' · '+d.sci+'</span></div><h2 class="title">'+d.title+'</h2></div>';
  s+='<div class="bigidea"><div class="lbl">Big idea</div><div class="t">'+d.big+'</div></div>';
  s+='<div class="sec"><div class="lbl">Visual</div>';
  (d.visuals||[]).forEach(function(v){s+=figure(v);});
  (d.tables||[]).forEach(function(t){s+=tableFig(t);});
  s+='</div>';
  if(d.fbox){s+='<div class="sec"><div class="lbl">Formulas</div>';d.fbox.forEach(function(f){s+=fboxHtml(f);});s+='</div>';}
  s+='<div class="sec"><div class="lbl">Key terms</div>'+flipsHtml(d.terms)+'</div>';
  s+=workHtml(d.work,id);
  if(d.work2){s+=workHtml(d.work2,id+'b');}
  s+='<div class="sec"><div class="lbl">Watch out</div>'+watchHtml(d.watch)+'</div>';
  s+='<div class="sec"><div class="lbl">Quick check</div>';
  d.qc.forEach(function(q,i){s+=qHtml(q,i,id);});
  s+='</div>';
  s+=mustHtml(d.must);
  s+='<div class="btnrow no-print">'+navBtns(id)+'</div>';
  return s+'</section>';
}
function navBtns(id){
  var i=ORDER.indexOf(id),s='';
  if(i>0){s+='<button class="btn ghost" type="button" data-go="'+ORDER[i-1]+'">← '+SUBS[ORDER[i-1]].code+'</button>';}
  if(i<ORDER.length-1){s+='<button class="btn" type="button" data-go="'+ORDER[i+1]+'">'+SUBS[ORDER[i+1]].code+' →</button>';}
  else{s+='<button class="btn" type="button" data-go="quiz">Mixed quiz →</button>';}
  return s;
}
function homeView(){
  var s='<section class="view" id="v-home" style="--ac-raw:#2563eb">';
  s+='<div class="homehero"><h1>Units S2.6 – S2.10</h1><div class="sub">16 subtopics · IGCSE Co-ordinated Sciences 0654 · <span class="ext">EXTENDED</span> marks the Extended-tier points</div></div>';
  UNITS.forEach(function(u){
    s+='<div class="unitcard" style="--ac-raw:'+u.ac+'"><div class="uh"><span class="uc">'+u.code+'</span><span class="un">'+u.name+'</span></div><div class="sublist">';
    u.subs.forEach(function(k){
      s+='<button class="subbtn" type="button" data-go="'+k+'" style="--ac-raw:'+SUBS[k].ac+'"><span class="c">'+SUBS[k].code+'</span><span class="t">'+SUBS[k].title+'</span></button>';
    });
    s+='</div></div>';
  });
  s+='<div class="twocol"><button class="subbtn" type="button" data-go="quiz" style="--ac-raw:#0f766e"><span class="c">QUIZ</span><span class="t">Mixed quiz · '+MIXED.length+' questions</span></button>'+
     '<button class="subbtn" type="button" data-go="recap" style="--ac-raw:#475569"><span class="c">RECAP</span><span class="t">One-page recap · printable</span></button></div>';
  return s+'</section>';
}
function quizView(){
  var s='<section class="view" id="v-quiz" style="--ac-raw:#0f766e" hidden>';
  s+='<div class="subhead"><div class="tagrow"><span class="tag">MIXED QUIZ</span><span class="tag sci">S2.6 – S2.10</span></div><h2 class="title">'+MIXED.length+' questions, exam style</h2></div>';
  s+='<div class="btnrow no-print"><span class="prog" id="qprog">Question 1 of '+MIXED.length+'</span><span class="prog" id="qscore">Score 0</span></div>';
  s+='<div class="bar no-print"><i id="qbar" style="width:0%"></i></div>';
  s+='<div id="qwrap">';
  MIXED.forEach(function(q,i){s+=qHtml(q,i,'mix');});
  s+='</div>';
  s+='<div class="btnrow no-print"><button class="btn" type="button" data-act="qnext" hidden>Next question</button></div>';
  s+='<div class="scorebox no-print" id="qdone" hidden></div>';
  s+='<div class="btnrow no-print"><button class="btn ghost" type="button" data-go="recap">One-page recap →</button></div>';
  return s+'</section>';
}
function recapView(){
  var s='<section class="view" id="v-recap" style="--ac-raw:#475569" hidden>';
  s+='<div class="subhead"><div class="tagrow"><span class="tag">RECAP</span></div><h2 class="title">Everything on one page</h2></div>';
  s+='<div class="recapgrid">';
  RECAP.forEach(function(r){
    s+='<div class="rc" style="--ac-raw:'+r.ac+'"><div class="rh"><span class="c">'+r.code+'</span><span class="t">'+r.title+'</span></div><ul>';
    r.rows.forEach(function(x){s+='<li>'+x+'</li>';});
    s+='</ul></div>';
  });
  s+='<div class="rc" style="--ac-raw:#111827"><div class="rh"><span class="c">⚠</span><span class="t">Letters that clash</span></div><div class="tbl"><table><tbody>';
  CLASHES.forEach(function(c){s+='<tr><td class="rowlab">'+c.a+'</td><td>'+c.b+'</td><td class="rowlab">'+c.c+'</td><td>'+c.d+'</td></tr>';});
  s+='</tbody></table></div></div>';
  s+='<div class="rc" style="--ac-raw:#111827"><div class="rh"><span class="c">UNITS</span><span class="t">Convert before you substitute</span></div><ul>';
  CONVERTS.forEach(function(c){s+='<li>'+c+'</li>';});
  s+='</ul></div>';
  return s+'</div></section>';
}

/* ---------- build ---------- */
var views=document.getElementById('views');
var html=homeView();
ORDER.forEach(function(id){html+=subView(id);});
html+=quizView()+recapView();
views.innerHTML=html;

var chips=document.getElementById('chips'),ch='';
UNITS.forEach(function(u){
  ch+='<span class="unitsep">'+u.code+'</span>';
  u.subs.forEach(function(k){
    ch+='<button class="chip" type="button" data-go="'+k+'" style="--ac-raw:'+SUBS[k].ac+'"><b>'+SUBS[k].code+'</b> '+SUBS[k].title+'</button>';
  });
});
ch+='<span class="unitsep">END</span><button class="chip" type="button" data-go="quiz" style="--ac-raw:#0f766e"><b>Mixed quiz</b></button>'+
    '<button class="chip" type="button" data-go="recap" style="--ac-raw:#475569"><b>Recap</b></button>';
chips.innerHTML=ch;

/* ---------- flip card sizing ---------- */
function sizeFlips(root){
  var fs=[].slice.call((root||document).querySelectorAll('.flip'));
  if(!fs.length){return;}
  fs.forEach(function(f){f.classList.add('meas');});
  var hs=fs.map(function(f){
    var h=0;[].slice.call(f.querySelectorAll('.face')).forEach(function(x){h=Math.max(h,x.getBoundingClientRect().height);});
    return Math.ceil(h)+2;
  });
  fs.forEach(function(f,i){f.classList.remove('meas');if(hs[i]>20){f.style.minHeight=hs[i]+'px';}});
}
var rt;
window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){
  var v=document.querySelector('.view:not([hidden])');if(v){sizeFlips(v);}
},180);});

/* ---------- routing ---------- */
function show(id){
  var el=document.getElementById('v-'+id);
  if(!el){id='home';el=document.getElementById('v-home');}
  [].slice.call(document.querySelectorAll('.view')).forEach(function(v){v.hidden=(v!==el);});
  [].slice.call(document.querySelectorAll('.chip')).forEach(function(c){
    c.setAttribute('aria-current',c.getAttribute('data-go')===id?'true':'false');
  });
  sizeFlips(el);
  var cur=document.querySelector('.chip[aria-current="true"]');
  if(cur&&cur.scrollIntoView){cur.scrollIntoView({block:'nearest',inline:'center'});}
  window.scrollTo(0,0);
}
function go(id){
  if(id==='home'){if(location.hash){location.hash='';}else{show('home');}return;}
  if(location.hash.slice(1)===id){show(id);}else{location.hash=id;}
}
window.addEventListener('hashchange',function(){show(location.hash.slice(1)||'home');});
document.getElementById('btn-home').addEventListener('click',function(){go('home');});

/* ---------- interaction ---------- */
var mixState={i:0,score:0,done:0,marks:[]};
function fbText(q,el,picked,correct){
  var d=el.querySelector('.fb');
  if(picked===correct){
    d.className='fb good';d.innerHTML='<b>Correct.</b> '+q.why[correct];
  }else{
    d.className='fb bad';
    d.innerHTML='<b>Not quite.</b> '+q.why[picked]+'<br><b>'+LET[correct]+' is right:</b> '+q.why[correct];
  }
  d.hidden=false;
}
function qData(el){
  var k=el.getAttribute('data-q').split(':'),i=parseInt(k[1],10);
  return k[0]==='mix'?MIXED[i]:SUBS[k[0]].qc[i];
}
document.addEventListener('click',function(ev){
  var t=ev.target.closest?ev.target.closest('[data-act],[data-go]'):null;
  if(!t){return;}
  var act=t.getAttribute('data-act'),goid=t.getAttribute('data-go');
  if(goid){go(goid);return;}
  if(act==='flip'){t.parentNode.classList.toggle('on');return;}
  if(act==='step'){
    var w=t.closest('.work'),steps=[].slice.call(w.querySelectorAll('.step')),n=0,j;
    for(j=0;j<steps.length;j++){if(steps[j].hidden){steps[j].hidden=false;n=j+1;break;}}
    if(!n){n=steps.length;}
    w.querySelector('.prog').textContent=n+' / '+steps.length;
    w.querySelector('[data-act="rework"]').hidden=false;
    if(n>=steps.length){t.disabled=true;t.textContent='All steps shown';}
    return;
  }
  if(act==='rework'){
    var w2=t.closest('.work');
    [].slice.call(w2.querySelectorAll('.step')).forEach(function(s){s.hidden=true;});
    var b=w2.querySelector('[data-act="step"]');b.disabled=false;b.textContent='Next step';
    w2.querySelector('.prog').textContent='0 / '+w2.querySelectorAll('.step').length;
    t.hidden=true;return;
  }
  if(act==='pick'){
    var qel=t.closest('.q');
    if(qel.getAttribute('data-done')==='1'){return;}
    qel.setAttribute('data-done','1');
    var q=qData(qel),picked=parseInt(t.getAttribute('data-i'),10),cor=q.correct;
    [].slice.call(qel.querySelectorAll('.opt')).forEach(function(o,j){
      if(j===cor){o.classList.add('good');}
      else if(j===picked){o.classList.add('bad');}
      else{o.classList.add('dim');}
    });
    fbText(q,qel,picked,cor);
    if(qel.getAttribute('data-q').indexOf('mix:')===0){markMix(qel,picked===cor);}
    return;
  }
  if(act==='checknum'){
    var qe=t.closest('.q');
    if(qe.getAttribute('data-done')==='1'){return;}
    var inp=qe.querySelector('input'),val=parseFloat(String(inp.value).replace(',','.'));
    var want=parseFloat(qe.getAttribute('data-num')),tol=parseFloat(qe.getAttribute('data-tol'));
    var fb=qe.querySelector('.fb');
    if(isNaN(val)){fb.className='fb';fb.innerHTML='Type a number first.';fb.hidden=false;return;}
    qe.setAttribute('data-done','1');
    var ok=Math.abs(val-want)<=tol;
    fb.className='fb '+(ok?'good':'bad');
    fb.innerHTML=ok?'<b>Correct.</b> See the working below.':'<b>Not quite.</b> The answer is <b>'+want+'</b>. Follow the working below.';
    fb.hidden=false;
    qe.querySelector('.sol').hidden=false;
    t.disabled=true;inp.readOnly=true;
    if(qe.getAttribute('data-q').indexOf('mix:')===0){markMix(qe,ok);}
    return;
  }
  if(act==='qnext'){
    mixState.i++;
    if(mixState.i>=MIXED.length){finishMix();}else{showMix();}
    return;
  }
  if(act==='qretry'){
    mixState={i:0,score:0,done:0,marks:[]};
    [].slice.call(document.querySelectorAll('#qwrap .q')).forEach(function(qe){
      qe.removeAttribute('data-done');
      [].slice.call(qe.querySelectorAll('.opt')).forEach(function(o){o.className='opt';});
      var f=qe.querySelector('.fb');if(f){f.hidden=true;f.className='fb';}
    });
    document.getElementById('qdone').hidden=true;
    showMix();return;
  }
},false);

function markMix(qel,ok){
  var i=parseInt(qel.getAttribute('data-q').split(':')[1],10);
  mixState.marks[i]=ok;mixState.done++;
  if(ok){mixState.score++;}
  document.getElementById('qscore').textContent='Score '+mixState.score;
  document.querySelector('[data-act="qnext"]').hidden=false;
  document.querySelector('[data-act="qnext"]').textContent=(mixState.i>=MIXED.length-1)?'See my score':'Next question';
}
function showMix(){
  [].slice.call(document.querySelectorAll('#qwrap .q')).forEach(function(qe,i){qe.hidden=(i!==mixState.i);});
  document.getElementById('qprog').textContent='Question '+(mixState.i+1)+' of '+MIXED.length;
  document.getElementById('qscore').textContent='Score '+mixState.score;
  document.getElementById('qbar').style.width=Math.round((mixState.i/MIXED.length)*100)+'%';
  var nb=document.querySelector('[data-act="qnext"]');
  var cur=document.querySelectorAll('#qwrap .q')[mixState.i];
  nb.hidden=!(cur&&cur.getAttribute('data-done')==='1');
  nb.textContent=(mixState.i>=MIXED.length-1)?'See my score':'Next question';
}
function finishMix(){
  [].slice.call(document.querySelectorAll('#qwrap .q')).forEach(function(qe){qe.hidden=true;});
  document.querySelector('[data-act="qnext"]').hidden=true;
  document.getElementById('qbar').style.width='100%';
  document.getElementById('qprog').textContent='Finished';
  var box=document.getElementById('qdone'),s='';
  s+='<div class="scorebig">'+mixState.score+' / '+MIXED.length+'</div>';
  s+='<div class="rev">';
  MIXED.forEach(function(q,i){
    s+='<div><span>'+(mixState.marks[i]?'✅':'❌')+'</span><span>Q'+(i+1)+' · '+q.sub+'</span></div>';
  });
  s+='</div><div class="btnrow"><button class="btn" type="button" data-act="qretry">Try again</button></div>';
  box.innerHTML=s;box.hidden=false;
}
showMix();
show(location.hash.slice(1)||'home');
})();
</script>

</body>
</html>
